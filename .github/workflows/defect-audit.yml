name: "UI/UX & Function Break Audit"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run UI/UX Defect & Function Checker
        run: |
          chmod +x check_defects.sh
          ./check_defects.sh --no-network

      - name: Upload HTML Defect Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defect-report
          path: |
            defect_report.html
            defect_report.json
